<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1200px;height:630px;overflow:hidden;}
body{background:#0A0E16;font-family:'Inter',sans-serif;color:#E7EEF7;position:relative;padding:76px 80px;display:flex;flex-direction:column;justify-content:center;}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 70% at 30% 20%,#000,transparent 75%);}
.glow{position:absolute;inset:0;background:radial-gradient(40% 50% at 12% 0%,rgba(45,212,191,.16),transparent 60%),radial-gradient(40% 50% at 95% 100%,rgba(56,189,248,.10),transparent 60%);}
.wrap{position:relative;}
.top{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
.logo{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,#2DD4BF,#38BDF8);color:#04120F;font-family:'JetBrains Mono',monospace;font-weight:800;font-size:26px;}
.kick{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#2DD4BF;}
h1{font-size:82px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-bottom:18px;}
h1 .g{background:linear-gradient(120deg,#2DD4BF,#38BDF8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tag{font-size:32px;font-weight:700;color:#E7EEF7;margin-bottom:14px;}
.tag b{color:#2DD4BF;}
.sub{font-size:24px;color:#93A1B5;font-family:'JetBrains Mono',monospace;margin-bottom:30px;}
.chips{display:flex;gap:14px;}
.chip{font-family:'JetBrains Mono',monospace;font-size:20px;color:#C7D2E0;border:1px solid rgba(45,212,191,.4);background:rgba(45,212,191,.10);padding:9px 20px;border-radius:999px;}
</style></head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><div class="logo">A</div><div class="kick">bitsofalber · Blue Team</div></div>
  <h1>Alberto <span class="g">Hidalgo</span></h1>
  <div class="tag">Convierto <b>TTPs reales</b> de atacantes en detecciones.</div>
  <div class="sub">SOC Analyst · SIEM (Splunk) · Detection Engineering · DFIR</div>
  <div class="chips"><div class="chip">Splunk</div><div class="chip">Sigma</div><div class="chip">MITRE ATT&amp;CK</div><div class="chip">eJPTv2</div><div class="chip">KrakenSOC-Labs</div></div>
</div>
</body></html>
