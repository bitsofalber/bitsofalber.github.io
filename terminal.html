<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal — Alberto Hidalgo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0E16'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='34' font-weight='700' text-anchor='middle' fill='%232DD4BF'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .term-wrap{max-width:920px;margin:40px auto 60px;padding:0 24px;}
  .term-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .term-head a{color:var(--muted);text-decoration:none;font-size:14px;font-family:var(--mono);}
  .term-head a:hover{color:var(--accent);}
  .window{background:linear-gradient(180deg,#0C1420,#0A1018);border:1px solid var(--border-strong);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);}
  .titlebar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);}
  .titlebar .dot{width:12px;height:12px;border-radius:50%;}
  .d1{background:#ff5f57;}.d2{background:#febc2e;}.d3{background:#28c840;}
  .titlebar .t{margin-left:10px;font-family:var(--mono);font-size:12.5px;color:var(--muted);}
  .screen{padding:20px;font-family:var(--mono);font-size:14.5px;line-height:1.75;color:#C7D2E0;min-height:420px;}
  .line{margin:3px 0;white-space:pre-wrap;word-break:break-word;}
  .prompt{color:var(--accent);font-weight:600;}
  .muted{color:var(--muted);}
  .accent{color:var(--accent);}
  .inputline{display:flex;align-items:center;gap:8px;}
  input{background:transparent;border:none;color:#E7EEF7;font-family:var(--mono);font-size:14.5px;outline:none;flex:1;caret-color:var(--accent);}
  .help-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px 14px;margin:6px 0;}
  .help-grid div{color:var(--accent);}
  .tip{color:var(--dim);font-size:12.5px;margin-top:8px;}
</style>
</head>
<body>
<div class="bg-glow"></div><div class="bg-grid"></div>

<div class="term-wrap">
  <div class="term-head">
    <a href="index.html">&larr; Volver al sitio</a>
    <span class="muted" style="font-family:var(--mono);font-size:12.5px">bitsofalber // interactive shell</span>
  </div>
  <div class="window">
    <div class="titlebar"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="t">visitor@bitsofalber: ~</span></div>
    <div class="screen" id="screen">
      <div class="line"><span class="accent">Welcome to bitsofalber shell</span> — SOC Analyst · Blue Team</div>
      <div class="line muted">Escribe <span class="accent">help</span> para ver los comandos disponibles.</div>
      <div class="line">&nbsp;</div>
      <div class="inputline" id="wrapline">
        <span class="prompt">visitor@bitsofalber:~$</span>
        <input id="cmd" autofocus autocomplete="off" spellcheck="false" aria-label="terminal">
      </div>
    </div>
  </div>
</div>

<script>
const screen=document.getElementById("screen");
const wrapline=document.getElementById("wrapline");
const input=document.getElementById("cmd");
const history=[];let hIdx=-1;

function print(html){const d=document.createElement("div");d.className="line";d.innerHTML=html;screen.insertBefore(d,wrapline);}
function focusInput(){input.focus();window.scrollTo(0,document.body.scrollHeight);}
document.addEventListener("click",focusInput);

function helpMenu(){
  print("<span class='accent'>Comandos disponibles:</span>");
  const g=document.createElement("div");g.className="help-grid";
  g.innerHTML=["about","skills","projects","writeups","cv","contact","whoami","date","uname","joke","ascii","clear","home"].map(c=>`<div>${c}</div>`).join("");
  screen.insertBefore(g,wrapline);
  print("<div class='tip'>Usa flechas arriba/abajo para el historial. Escribe <span class='accent'>clear</span> para limpiar.</div>");
}

function run(cmd){
  print(`<span class="prompt">visitor@bitsofalber:~$</span> ${cmd}`);
  switch(cmd){
    case "help": helpMenu(); break;
    case "whoami": print("visitor"); break;
    case "about": print("Alberto Hidalgo — SOC Analyst &amp; Blue Team. SIEM (Splunk), detection engineering, forense de red y DFIR."); break;
    case "skills": print("Splunk · SPL · Sysmon · Sigma · MITRE ATT&amp;CK · Wireshark · Nmap · Burp Suite · Linux · Docker"); break;
    case "projects": print("KrakenSOC-Labs · ASIR Learning Labs · Raspberry Homelab · Cybersecurity Notes"); setTimeout(()=>location.href="index.html#proyectos",900); break;
    case "writeups": print("<span class='muted'>Abriendo write-ups...</span>"); setTimeout(()=>location.href="writeups.html",700); break;
    case "cv": print("<span class='muted'>Abriendo CV...</span>"); setTimeout(()=>location.href="cv.html",700); break;
    case "contact": print("bitsofalber@gmail.com &nbsp;·&nbsp; github.com/bitsofalber &nbsp;·&nbsp; in/ahidalgotech"); break;
    case "home": case "exit": print("<span class='muted'>Volviendo al inicio...</span>"); setTimeout(()=>location.href="index.html",600); break;
    case "date": print(new Date().toString()); break;
    case "uname": print("bitsofalber SOC-shell 1.0 (blue-team)"); break;
    case "joke": print("Por que los analistas aman el modo oscuro? Porque la luz atrae bugs."); break;
    case "ascii": print("   /\\_/\\\n  ( o.o )   &lt; detect · investigate · respond\n   &gt; ^ &lt;"); break;
    case "clear": screen.querySelectorAll(".line,.help-grid").forEach(n=>{if(n!==wrapline)n.remove();}); break;
    case "": break;
    default: print(`command not found: ${cmd} — escribe <span class='accent'>help</span>`);
  }
  focusInput();
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){const c=input.value.trim().toLowerCase();if(c){history.push(c);hIdx=history.length;}run(c);input.value="";}
  else if(e.key==="ArrowUp"){if(hIdx>0){hIdx--;input.value=history[hIdx]||"";}e.preventDefault();}
  else if(e.key==="ArrowDown"){if(hIdx<history.length-1){hIdx++;input.value=history[hIdx]||"";}else{hIdx=history.length;input.value="";}e.preventDefault();}
});
focusInput();
</script>
</body>
</html>
