<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal — Alberto Hidalgo</title>
<meta name="description" content="Terminal interactiva del portfolio de Alberto Hidalgo (bitsofalber).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0E16'/%3E%3Ctext x='32' y='45' font-family='monospace' font-size='34' font-weight='700' text-anchor='middle' fill='%232DD4BF'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<!-- Terminal specific styles that can't be in the global CSS -->
<style>
  .term-wrapper {
    background-color: var(--sidebar-bg);
    border-radius: 24px;
    padding: 24px;
    color: #F8FAFC;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    height: 600px;
    overflow-y: auto;
    position: relative;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .term-output {
    white-space: pre-wrap;
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .term-input-line {
    display: flex;
    align-items: center;
  }
  .term-prompt {
    color: var(--primary);
    margin-right: 8px;
    font-weight: bold;
  }
  .term-input {
    background: transparent;
    border: none;
    color: #F8FAFC;
    font-family: inherit;
    font-size: inherit;
    flex: 1;
    outline: none;
  }
  .term-cmd-color { color: var(--yellow); }
  .term-dir-color { color: var(--blue); }
  .term-err-color { color: var(--primary); }
</style>
</head>
<body>

<div class="device-frame">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="index.html" class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    </a>
    <a href="cv.html" class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </a>
    <a href="writeups.html" class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    </a>
    <a href="projects.html" class="nav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </a>
    <a href="terminal.html" class="nav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    </a>
    <a href="mailto:albertohidalgomoreno@gmail.com" class="nav-btn sidebar-bottom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="app-content">
    <div class="header">
      <div class="header-left">
        <span data-en="Interactive">Interactive</span> <b>Terminal</b>
      </div>
      <div class="header-right">
        <div class="search-bar">
          <input type="text" placeholder="Type 'help' in terminal..." data-en="Type 'help' in terminal..." disabled>
          <button class="search-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
        <a href="https://github.com/bitsofalber" class="nav-btn" style="color:var(--text-dark); border: 1.5px solid var(--border); border-radius:50%; width:44px; height:44px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>

    <div class="dashboard-scroll">
      
      <div class="term-wrapper" id="terminal" onclick="document.getElementById('cmdInput').focus()">
        <div id="output" class="term-output">Bienvenido a la terminal interactiva de Alberto Hidalgo.
Escribe <span class="term-cmd-color">help</span> para ver los comandos disponibles.
</div>
        <div class="term-input-line">
          <span class="term-prompt">guest@bitsofalber:~$</span>
          <input type="text" id="cmdInput" class="term-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  const input = document.getElementById('cmdInput');
  const output = document.getElementById('output');
  const term = document.getElementById('terminal');

  const commands = {
    help: `Comandos disponibles:
  <span class="term-cmd-color">whoami</span>    - Muestra información sobre mí
  <span class="term-cmd-color">skills</span>    - Lista de habilidades técnicas
  <span class="term-cmd-color">projects</span>  - Ver proyectos principales
  <span class="term-cmd-color">contact</span>   - Información de contacto
  <span class="term-cmd-color">clear</span>     - Limpia la terminal
  <span class="term-cmd-color">gui</span>       - Volver al modo gráfico (Inicio)`,
    whoami: `Alberto Hidalgo (bitsofalber)
SOC Trainee & Estudiante de ASIR apasionado por el Blue Team.
Me dedico a crear entornos de simulación (KrakenSOC-Labs) y analizar incidentes.`,
    skills: `[ Blue Team / SOC ]
  - SIEM (Splunk, Elastic)
  - Network Forensics (Wireshark, Zeek)
  - Log Analysis (Sysmon, Windows Event Logs)
  - Detections (Sigma, Suricata)

[ Systems & Infrastructure ]
  - Linux & Windows Server
  - Docker & Containerization
  - Networking & Routing
  - Bash & Python Scripting`,
    projects: `1. KrakenSOC-Labs: Entornos dockerizados para threat hunting.
2. Silent Harvest: Write-up sobre exfiltración DNS.
3. Battering Ram: Write-up sobre password spraying.
Escribe 'gui' para ir a la sección visual de proyectos.`,
    contact: `Email: albertohidalgomoreno@gmail.com
GitHub: https://github.com/bitsofalber
LinkedIn: https://linkedin.com/in/ahidalgotech`
  };

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const cmd = input.value.trim().toLowerCase();
      input.value = '';
      
      let response = '';
      if (cmd === 'clear') {
        output.innerHTML = '';
        return;
      } else if (cmd === 'gui') {
        window.location.href = 'index.html';
        return;
      } else if (cmd === '') {
        response = '';
      } else if (commands[cmd]) {
        response = commands[cmd];
      } else {
        response = `<span class="term-err-color">bash: ${cmd}: command not found</span>`;
      }
      
      const promptLine = `<div class="term-input-line"><span class="term-prompt">guest@bitsofalber:~$</span> ${cmd}</div>`;
      output.innerHTML += (output.innerHTML ? '\n' : '') + promptLine + (response ? '\n' + response : '') + '\n';
      term.scrollTop = term.scrollHeight;
    }
  });
</script>
<script src="assets/main.js"></script>
</body>
</html>
